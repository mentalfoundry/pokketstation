name: Tests

# Builds the core, the tests, the tools, and the libretro core, and then runs
# ctest. This is the workflow that guards each change. The two release
# workflows are manual and they publish artifacts; neither one runs on a push,
# thus neither one guards anything.
#
# The test job is Windows only. This project develops on Windows, and the
# libretro buildbot in .gitlab-ci.yml compiles the core for each other
# platform. The sanitizers job below is the one exception, and it runs on Linux
# because it needs clang.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A new push to the same ref makes the earlier run pointless. Stop it and keep
# the runner minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.build_type }}
    runs-on: windows-latest
    strategy:
      # A failure in one configuration must not hide the result of the other.
      fail-fast: false
      matrix:
        build_type: [Debug, Release]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # No SDL2 and no vcpkg here. The desktop frontend is the only part that
      # needs SDL2, and CMake skips that frontend with a warning when SDL2 is
      # absent. This workflow stays fast and needs no package step.
      #
      # ONE TEST DOES NOT RUN HERE. content_writeback_selftest belongs to the
      # desktop frontend, thus a build without SDL2 does not register it. This
      # workflow runs 5 tests, and a build with SDL2 registers 6. The Windows
      # release workflow builds with SDL2 and runs the full set.
      #
      # The core, the tests, the tools, and the libretro core need no
      # dependency. The libretro core does fetch the libretro-common headers at
      # the configure step, thus this step needs network access.
      - name: Configure
        run: cmake -B build -S .

      # The Visual Studio generator is multi-config. Thus the configure step
      # takes no build type, and one configured directory serves each config.
      # --config below selects the config, and -C does the same for ctest.
      - name: Build
        run: cmake --build build --config ${{ matrix.build_type }}

      - name: List registered tests
        run: ctest --test-dir build -C ${{ matrix.build_type }} -N

      # bu_test needs a BIOS dump, and .gitignore excludes each dump. That
      # suite reports exit code 77 when it finds no dump, and CMake gives it
      # SKIP_RETURN_CODE 77. Thus ctest reports it as skipped, and the run
      # stays green. See the comment at the top of tests/bu_test.c.
      #
      # The Release job matters here. Each test suite calls #undef NDEBUG
      # before <assert.h>, because NDEBUG removes every assert() call. That job
      # is the check that the suites still test something in a Release build.
      - name: Test
        run: ctest --test-dir build -C ${{ matrix.build_type }} --output-on-failure

  sanitizers:
    name: clang address and undefined
    runs-on: ubuntu-latest

    # THIS JOB FINDS WHAT THE WINDOWS JOB CANNOT. MSVC has no equivalent of
    # these two sanitizers. cpu_test holds the ARM and Thumb assertions, and
    # this job is the only place that executes them under a second compiler.
    # An unaligned access, a signed overflow, and a read outside an array all
    # report here and nowhere else.
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # -fno-sanitize-recover=all IS THE IMPORTANT FLAG. Without it the
      # undefined-behavior sanitizer prints a report and then continues, the
      # test still gives exit code 0, and this job stays green while it holds
      # a defect. With it, the first report stops the program and ctest reports
      # a failure.
      #
      # The libretro core and the desktop frontend are off. The core, the
      # tools, and the tests are the code that this job examines. The libretro
      # core also fetches headers at the configure step, and this job needs no
      # network access without it.
      #
      # The Makefile generator on Linux is single-config, thus CMAKE_BUILD_TYPE
      # selects the config here. Debug keeps the optimizer away from the stack
      # traces.
      - name: Configure
        run: >
          cmake -B build -S .
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_C_COMPILER=clang
          -DPSEMU_BUILD_LIBRETRO=OFF
          -DPSEMU_BUILD_DESKTOP=OFF
          -DCMAKE_C_FLAGS="-fsanitize=address,undefined -fno-sanitize-recover=all -fno-omit-frame-pointer -g"
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"

      - name: Build
        run: cmake --build build

      - name: Test
        env:
          UBSAN_OPTIONS: print_stacktrace=1
        run: ctest --test-dir build --output-on-failure
